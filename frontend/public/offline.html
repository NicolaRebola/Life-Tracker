<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#a86449" />
    <title>Life Tracker — Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: "DM Sans", system-ui, sans-serif;
        background: #f6eadf;
        color: #3f2b24;
      }

      main {
        max-width: 24rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        font-weight: 600;
      }

      p {
        margin: 0 0 1.5rem;
        line-height: 1.5;
        color: #5f3d31;
      }

      button {
        border: none;
        border-radius: 9999px;
        padding: 0.75rem 1.25rem;
        font: inherit;
        font-weight: 600;
        color: #fff8f0;
        background: #a86449;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid #73402f;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Life Tracker needs an internet connection for sign-in and synced data.
        Reconnect and try again.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
    </main>
  </body>
</html>
